name: Deploy visit counter

on:
  push:
    branches: [main]
    paths:
      - 'workers/counter/**'
      - 'scripts/lib/report-email.mjs'
      - '.github/workflows/deploy-counter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare is set up
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ID: ${{ vars.D1_DATABASE_ID }}
          COUNTER_TOKEN: ${{ secrets.COUNTER_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$D1_ID" ] || [ -z "$COUNTER_TOKEN" ]; then
            echo "::warning::Cloudflare isn't set up yet (see README → Analytics). Skipping."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Point at the database
        if: steps.check.outputs.skip != '1'
        run: sed -i "s/__D1_DATABASE_ID__/${{ vars.D1_DATABASE_ID }}/" workers/counter/wrangler.toml

      - name: Create tables and deploy
        if: steps.check.outputs.skip != '1'
        uses: cloudflare/wrangler-action@v3
        env:
          COUNTER_TOKEN: ${{ secrets.COUNTER_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/counter
          secrets: |
            COUNTER_TOKEN
          command: |
            d1 execute thekla-links --remote --file=schema.sql
            deploy
